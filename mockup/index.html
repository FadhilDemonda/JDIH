<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JDIH RS AN-NISA - Jaringan Dokumentasi dan Informasi Hukum</title>
  <link rel="icon" type="image/png" href="assets/logo-rs-annisa.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Lewati ke konten utama</a>

  <div id="app-shell" class="app-shell">
    <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

    <aside id="sidebar" class="sidebar" aria-label="Navigasi utama">
      <div class="sidebar-brand">
        <a href="#/dokumen" class="brand-link" aria-label="JDIH RS AN-NISA Beranda">
          <span class="brand-mark">
            <img src="assets/logo-jdih-opt4-layers.svg" alt="" width="46" height="46" class="brand-logo" decoding="async">
          </span>
          <span class="brand-copy">
            <strong class="brand-title">JDIH RS AN-NISA</strong>
            <span class="brand-sub">Repositori Regulasi Internal</span>
          </span>
        </a>
        <button id="sidebar-close-btn" class="icon-btn sidebar-close-btn" type="button" aria-label="Tutup menu navigasi">
          <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
            <path d="M5 5l10 10M15 5L5 15"/>
          </svg>
        </button>
      </div>

      <nav id="sidebar-nav" class="sidebar-nav" aria-label="Menu aplikasi"></nav>

      <div class="sidebar-footer">
        <label class="role-switch-label" for="demo-role-select">Simulasi peran aktif</label>
        <select id="demo-role-select" class="role-switch-select" aria-label="Simulasi peran aktif">
          <option value="STAF">Staf (Apt. Rina Kartika)</option>
          <option value="KOORDINATOR">Koordinator/SPV (Ns. Budi Santoso)</option>
          <option value="MANAJER">Manajer (dr. Hendra Wijaya)</option>
          <option value="SUPER_ADMIN">Super Admin (M. Fadhil Pratama)</option>
        </select>
      </div>
    </aside>

    <div class="workspace-frame">
      <header id="topbar" class="topbar">
        <div class="topbar-left">
          <button id="menu-toggle-btn" class="icon-btn menu-toggle-btn" type="button" aria-label="Buka menu navigasi" aria-expanded="false" aria-controls="sidebar">
            <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
              <path d="M3 5h14M3 10h14M3 15h14"/>
            </svg>
          </button>
          <div id="topbar-context" class="topbar-context"></div>
        </div>

        <div class="topbar-actions">
          <button id="theme-toggle-btn" class="icon-btn topbar-action-btn" type="button" aria-label="Ubah tema tampilan" aria-pressed="false" title="Ubah tema terang atau gelap">
            <span class="theme-icon-stage" aria-hidden="true">
              <svg id="theme-icon-sun" class="theme-svg theme-svg-sun" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="10" cy="10" r="3.5"/>
                <path d="M10 2.2v1.6M10 16.2v1.6M2.2 10h1.6M16.2 10h1.6M4.5 4.5l1.1 1.1M14.4 14.4l1.1 1.1M15.5 4.5l-1.1 1.1M5.6 14.4l-1.1 1.1"/>
              </svg>
              <svg id="theme-icon-moon" class="theme-svg theme-svg-moon" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16.8 11.9A6.8 6.8 0 018.1 3.2a7 7 0 108.7 8.7z"/>
              </svg>
            </span>
          </button>

          <div class="notif-wrapper">
            <button id="notif-bell-btn" class="icon-btn topbar-action-btn" type="button" aria-label="Notifikasi" aria-expanded="false" aria-controls="notif-popover">
              <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 7a5 5 0 10-10 0c0 4.5-2 6-2 6h14s-2-1.5-2-6z"/>
                <path d="M8.5 16a1.7 1.7 0 003 0"/>
              </svg>
              <span id="notif-badge" class="notif-badge" hidden>0</span>
            </button>
            <div id="notif-popover" class="notif-popover" role="region" aria-label="Daftar notifikasi terbaru" hidden></div>
          </div>

          <a href="#/profil" id="user-profile-link" class="user-chip" aria-label="Profil pengguna">
            <span id="user-avatar" class="user-avatar" aria-hidden="true">RK</span>
            <span class="user-meta">
              <span id="user-name-label" class="user-name">Apt. Rina Kartika, S.Farm</span>
              <span id="user-role-label" class="user-role">Staf · Farmasi</span>
            </span>
          </a>

          <button id="logout-btn" class="btn btn-ghost" type="button" aria-label="Keluar dari sesi">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12.5 15.5H5a1.5 1.5 0 01-1.5-1.5V6A1.5 1.5 0 015 4.5h7.5M13 13l3.5-3L13 7M16.5 10H8"/>
            </svg>
            <span class="logout-text">Keluar</span>
          </button>
        </div>
      </header>

      <main id="main-content" class="main-content" tabindex="-1"></main>
    </div>
  </div>

  <dialog id="confirm-dialog" class="modal-dialog" aria-labelledby="confirm-dialog-title">
    <form method="dialog" id="confirm-dialog-form" class="modal-card" novalidate>
      <div class="modal-header">
        <h2 id="confirm-dialog-title" class="modal-title">Konfirmasi tindakan</h2>
        <button type="button" class="icon-btn" id="confirm-dialog-close" aria-label="Tutup dialog">
          <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
            <path d="M5 5l10 10M15 5L5 15"/>
          </svg>
        </button>
      </div>
      <div id="confirm-dialog-body" class="modal-body"></div>
      <div id="confirm-dialog-footer" class="modal-footer"></div>
    </form>
  </dialog>

  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
